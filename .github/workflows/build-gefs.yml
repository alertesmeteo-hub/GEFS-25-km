name: Produire cartes et tableaux GEFS
on:
  workflow_dispatch:
  schedule:
    - cron: '25 5,11,17,23 * * *'
permissions:
  contents: write
concurrency:
  group: gefs-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vérifier le code
        run: |
          python -m unittest discover -s tests
          node tests/test_module.cjs
          php -l wordpress/gefs-25-km/gefs-25-km.php
          node --check wordpress/gefs-25-km/assets/module.js
      - name: Extraire les 31 membres et produire les cartes
        run: python scripts/build_data.py
      - name: Valider la publication complète
        run: python scripts/validate_data.py
      - name: Publier les données validées
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p build/publish
          cd build/publish
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git checkout -b data FETCH_HEAD
            python ../../scripts/check_newer.py ../data/index.json index.json
            git rm -r --ignore-unmatch .
          else
            git checkout --orphan data
          fi
          cp -a ../data/. .
          touch .nojekyll
          git add .
          git commit -m 'Publication GEFS validée : 31 membres'
          git push origin HEAD:data
      - name: Créer le ZIP WordPress
        run: |
          cd wordpress
          zip -qr ../build/gefs-25-km-v1.0.0.zip gefs-25-km
      - uses: actions/upload-artifact@v4
        with:
          name: gefs-wordpress
          path: build/gefs-25-km-v1.0.0.zip
